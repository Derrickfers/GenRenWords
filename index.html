 // 2.catch real word from dictionary
        async function isRealWord(word) {
            try {
              const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                if (response.ok) {
                    const data = await response.json();
                    return {
                        found: true,
                        meaning: data[0]?.meanings[0]?.definitions[0]?.definition || "Meaning not found"
                    };
                    }else{
                    return {
                        found: false,
                        meaning: null
                    };
                    } 
            } catch (error) {
                console.error("Fetch failed:", error);
                    return {
                        found: false,
                        meaning: null
                    };
            }
        };

// 3.generate until find valid word
 const getValidWord = async() => {
    let tries = 0;
    let result;
    let word = "";
    do {
        word = allWords();
        result = await isRealWord(word);
        tries++;
        if (tries > 20) break; // prevent infinite loop
    } while (!result.found);

    if (result.found) {
        return { word: word, meaning: result.meaning };
    } else {
        return null; // no valid word found
    }
}

        return null; // no valid word found
    }

// main section
const observer1 = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const children = entry.target.querySelectorAll("h1, p, button");
      children.forEach((el, index) => {
        setTimeout(() => {
          el.classList.add("start-rotate");
        }, index * 300);  
      });
      // Optional: unobserve after first trigger
      observer1.unobserve(entry.target);
    }
  });
}); 
const mainSection = document.querySelector('.main-info');
observer1.observe(mainSection);
